name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "*.zip"
      - name: Corrigir import
        run: |
          sed -i 's/^import com.badlogic.gdx.graphics.\*;/&\nimport com.badlogic.gdx.graphics.g2d.*;/' StrikeArenaJava/core/src/main/java/com/strikearena/StrikeArenaGame.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: StrikeArenaJava
        run: gradle :android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: StrikeArena-APK
          path: StrikeArenaJava/android/build/outputs/apk/debug/*.apk
